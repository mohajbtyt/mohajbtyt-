<!DOCTYPE html>
<html lang="ar">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8963238677390268"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <title>mohajbtyt - تحويل النص إلى صورة بالذكاء الاصطناعي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      direction: rtl;
      font-family: sans-serif;
      background-image: url('https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      padding: 20px;
      text-align: center;
      color: white;
    }
    textarea {
      width: 90%;
      padding: 10px;
      font-size: 16px;
      max-length: 50;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px 5px;
      cursor: pointer;
    }
    .credit {
      font-size: 18px;
      margin-bottom: 15px;
    }
    #output-image {
      margin-top: 30px;
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <h1>mohajbtyt</h1>
  <h3>حوّل النص إلى صورة باستخدام الذكاء الاصطناعي</h3>

<!-- AdSense Ad Unit -->
<ins class="adsbygoogle"
     style="display:block; text-align:center; margin:20px auto;"
     data-ad-client="ca-pub-8963238677390268"
     data-ad-slot="1234567890"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

  <p class="credit">رصيدك: <span id="credit">0</span> نقطة</p>
  <p>اكتب وصفاً (بحد أقصى 50 حرفاً)، ثم اضغط على الزر لتوليدها (خصم نقطة).</p>

  <textarea id="prompt" rows="4" maxlength="50" placeholder="اكتب وصف الصورة هنا (50 حرف كحد أقصى)..."></textarea><br>
  <button onclick="generateImage()">توليد صورة</button>
  <button onclick="rechargeCredit()">إضافة 5 نقاط</button>
  <button onclick="downloadImage()">حفظ الصورة</button>

  <div id="result">
    <h3>الصورة الناتجة:</h3>

<!-- AdSense Ad Unit -->
<ins class="adsbygoogle"
     style="display:block; text-align:center; margin:20px auto;"
     data-ad-client="ca-pub-8963238677390268"
     data-ad-slot="1234567890"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>

    <img id="output-image" src="" alt="سيتم عرض الصورة هنا">
  </div>

  <script>
    function getCredit() {
      let credit = localStorage.getItem('credit');
      if (credit === null) {
        credit = 50;
        localStorage.setItem('credit', credit);
      }
      return parseInt(credit);
    }

    function updateCreditDisplay() {
      document.getElementById('credit').innerText = getCredit();
    }

    function deductCredit() {
      let credit = getCredit();
      if (credit <= 0) {
        alert("رصيدك انتهى!");
        return false;
      }
      credit -= 1;
      localStorage.setItem('credit', credit);
      updateCreditDisplay();
      return true;
    }

    function rechargeCredit() {
      let credit = getCredit();
      credit += 5;
      localStorage.setItem('credit', credit);
      updateCreditDisplay();
      alert("تمت إضافة 5 نقاط!");
    }

    function generateImage() {
      const prompt = document.getElementById('prompt').value.trim();
      if (prompt.length === 0 || prompt.length > 50) {
        alert("يرجى إدخال وصف لا يزيد عن 50 حرفاً.");
        return;
      }

      if (!deductCredit()) return;

      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + ", ultra high resolution, 4k, no watermark")}`;
      const img = document.getElementById('output-image');

      img.src = "";
      setTimeout(() => {
        img.src = imageUrl;
        img.setAttribute("data-img-url", imageUrl);
      }, 4000);
    }

    function downloadImage() {
      const img = document.getElementById('output-image');
      const url = img.getAttribute("data-img-url");
      if (!url) {
        alert("لا توجد صورة لتحميلها.");
        return;
      }
      const link = document.createElement('a');
      link.href = url;
      link.download = 'mohajbtyt_image_4k.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    updateCreditDisplay();
  </script>
</body>
</html>
